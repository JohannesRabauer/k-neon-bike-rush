<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050510" />
  <title>Neon Bike Rush</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas"></canvas>

    <!-- Touch controls overlay (only visible on touch / small screens) -->
    <div id="touch-controls" class="hidden">
      <button class="touch-btn brake" data-control="brake" aria-label="Brake">BRAKE</button>
      <button class="touch-btn leanback" data-control="leanBack" aria-label="Lean back">&#8630;</button>
      <button class="touch-btn gas" data-control="gas" aria-label="Gas">GAS</button>
      <button class="touch-btn leanfwd" data-control="leanFwd" aria-label="Lean forward">&#8631;</button>
      <button class="touch-btn jump" data-control="jump" aria-label="Jump">&#8593;</button>
    </div>

    <!-- In-game HUD restart button -->
    <button id="hud-restart" class="hidden">&#8635; RESTART</button>
    <button id="hud-menu" class="hidden">&#9776; MENU</button>
  </div>

  <!-- Matter.js physics engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <!-- Game modules (global scope, ordered by dependency) -->
  <script src="js/storage.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/bike.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
